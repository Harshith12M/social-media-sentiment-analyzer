<!DOCTYPE html>
<html>
<head>
    <title>Social Media Sentiment Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Social Media Sentiment Analyzer</h1>

        <div class="section">
            <h2>Analyze a Single Post</h2>
            <form action="/analyze" method="post">
                <textarea name="text" rows="4" cols="50" placeholder="Enter a social media post (e.g., I love this app!)"></textarea>
                <button type="submit">Analyze</button>
            </form>
        </div>

        <div class="section">
            <h2>Analyze a CSV File</h2>
            <form action="/analyze_csv" method="post" enctype="multipart/form-data">
                <input type="file" name="file" accept=".csv">
                <button type="submit">Upload and Analyze</button>
            </form>
        </div>
    </div>
</body>
</html>
