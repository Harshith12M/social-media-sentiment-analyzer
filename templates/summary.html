<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analysis Summary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Sentiment Analysis Summary</h1>

        <h2>Results</h2>
        <table>
            <tr>
                <th>Post</th>
                <th>Sentiment</th>
            </tr>
            {% for post in posts %}
            <tr>
                <td>{{ post.text }}</td>
                <td>{{ post.sentiment }}</td>
            </tr>
            {% endfor %}
        </table>

        <h2>Sentiment Distribution</h2>
        <div id="chart"></div>

        <a href="/">Back to Home</a>
    </div>

    <script>
        var graph = {{ graph_json | safe }};
        Plotly.newPlot('chart', graph.data, graph.layout);
    </script>
</body>
</html>
